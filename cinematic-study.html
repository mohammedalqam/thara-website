<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>THARA — دراسة المشهد المعماري</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3efe6;color:#173b35;font-family:Tahoma,Arial,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 4vw;border-bottom:1px solid #d5c9b1}.brand{font-family:Georgia,serif;letter-spacing:.22em;font-size:25px}header a{color:inherit;font-size:13px}main{max-width:1920px;margin:auto}.stage{width:100%;height:calc(100svh - 190px);min-height:360px;position:relative;background:#e9e4d6}.stage canvas{display:block;width:100%;height:100%}.stage:empty:after{content:'جارٍ تحميل الدراسة المعمارية';position:absolute;inset:45% 0;text-align:center}.controls{padding:16px 4vw;display:flex;flex-wrap:wrap;gap:12px;align-items:center}button{border:1px solid #b89a63;border-radius:3px;background:transparent;color:#173b35;padding:10px 17px;font:inherit;cursor:pointer}button:hover,button:focus-visible{background:#173b35;color:#f3efe6}input{flex:1;min-width:120px;accent-color:#173b35;direction:ltr}output{font-variant-numeric:tabular-nums;min-width:40px}small{font-size:11px;color:#6e7467}footer{display:flex;justify-content:space-between;gap:10px;padding:0 4vw 16px;font-size:12px;line-height:1.7}.caption{max-width:65ch}@media(max-width:600px){header{padding:13px 18px}.stage{height:60svh;min-height:340px}.controls{padding:12px 16px;gap:8px}button{font-size:12px;padding:9px 10px}footer{display:block}.controls label{width:100%}}
</style></head>
<body><header><span class="brand" dir="ltr">THARA</span><span>دراسة المشهد · المرحلة الثانية</span><a href="index.html">الرئيسية الحالية</a></header>
<main><div class="stage" data-cinematic-study data-state="loading" aria-label="دراسة ثلاثية الأبعاد لفيلا تخيلية تحمل هوية ثرى"></div>
<div class="controls"><button type="button" data-shot="0" disabled>الواجهة</button><button type="button" data-shot="0.34" disabled>الباب والشعار</button><button type="button" data-shot="0.54" disabled>عبور المدخل</button><button type="button" data-shot="0.8" disabled>الداخل والمسبح</button><label for="studyProgress">موضع الرحلة</label><input id="studyProgress" data-progress type="range" min="0" max="100" value="0" disabled><output data-value dir="ltr">0%</output></div>
<footer><div class="caption"><strong data-status>تجهيز المشهد</strong><br>تصوّر معماري لهوية ثرى؛ ليس عقارًا متاحًا للحجز. هذه دراسة للفحص وليست النسخة النهائية.</div><small data-metrics dir="ltr"></small></footer></main>
<script type="module" src="assets/cinematic-study.js"></script></body></html>
