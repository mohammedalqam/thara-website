<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THARA — مراجعة التصميم</title>
<style>body{margin:0;background:#202b2b;color:#fff;font:14px system-ui}header{padding:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}select,button{font:inherit;padding:9px;border-radius:5px}main{display:grid;justify-content:center;overflow:auto;background:#404a47;padding:18px}iframe{border:0;width:1180px;height:780px;background:#f5f2ea;max-width:none}</style>
<header><strong>THARA — مراجعة التصميم</strong><label>العرض <select id="width"><option>1180</option><option>768</option><option>390</option><option>320</option></select></label><label>الصفحة <select id="page"><option value="index.html">الرئيسية</option><option value="villas.html">الفلل</option><option value="contact.html">خدمات الملاك</option><option value="faq.html">الأسئلة</option><option value="about.html">عن ثرى</option><option value="privacy.html">الخصوصية</option><option value="terms.html">الشروط</option></select></label><label><input id="scripts" type="checkbox" checked> JavaScript</label><button id="restart">من البداية</button></header>
<main><iframe id="preview" title="معاينة موقع ثرى" src="index.html"></iframe></main>
<script>const frame=document.getElementById('preview');document.getElementById('width').onchange=e=>frame.style.width=e.target.value+'px';function reload(){frame.setAttribute('sandbox',document.getElementById('scripts').checked?'allow-scripts allow-same-origin allow-forms':'allow-same-origin allow-forms');frame.src=document.getElementById('page').value;}document.getElementById('page').onchange=reload;document.getElementById('scripts').onchange=reload;document.getElementById('restart').onclick=reload;</script></html>
