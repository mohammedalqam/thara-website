<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>معاينة ثرى — فحص الشاشات</title>
<style>
body{margin:0;background:#293530;color:#f1e5cd;font:14px system-ui,sans-serif}header{display:flex;justify-content:center;align-items:center;gap:10px;padding:12px;flex-wrap:wrap}button,select{font:inherit;padding:9px 15px;background:#e0c798;color:#142020;border:0;border-radius:5px;cursor:pointer}button[aria-pressed=true]{outline:2px solid #fff;outline-offset:3px}label{display:flex;gap:8px;align-items:center}main{display:flex;justify-content:center;padding:12px;overflow:auto}iframe{display:block;width:390px;height:844px;flex-shrink:0;border:1px solid #b1a180;border-radius:12px;background:#142020}small{display:block;text-align:center;color:#c3c6b8;padding:8px}
</style></head><body>
<header><strong>فحص التصميم</strong><button data-width="320" aria-pressed="false">320</button><button data-width="390" aria-pressed="true">390</button><button data-width="768" aria-pressed="false">768</button><button data-width="1180" aria-pressed="false">1180</button>
<select id="page" aria-label="الصفحة"><option value="index.html">الرئيسية</option><option value="villas.html">الفلل</option><option value="contact.html">خدمات الملاك</option><option value="faq.html">الأسئلة الشائعة</option><option value="about.html">من نحن</option></select>
<label><input id="noScripts" type="checkbox">بدون JavaScript</label></header>
<main><iframe title="معاينة الموقع" src="index.html" id="preview"></iframe></main>
<small>صفحة فحص مؤقتة. لا تُرسل رسائل واتساب أثناء الفحص.</small>
<script>
let frame=document.getElementById('preview');const page=document.getElementById('page');
document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{frame.style.width=button.dataset.width+'px';document.querySelectorAll('[data-width]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)))}));
page.addEventListener('change',()=>{frame.src=page.value});
document.getElementById('noScripts').addEventListener('change',event=>{const replacement=frame.cloneNode();if(event.target.checked)replacement.setAttribute('sandbox','allow-same-origin');else replacement.removeAttribute('sandbox');frame.replaceWith(replacement);frame=replacement});
</script></body></html>
