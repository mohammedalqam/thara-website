<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THARA V3 — فحص التصميم</title><style>body{margin:0;background:#d6dbd0;color:#173b35;font:14px Arial,sans-serif}header{position:sticky;top:0;padding:12px 20px;display:flex;gap:20px;align-items:center;background:#f5f0e5;z-index:2;border-bottom:1px solid #aaa}select,button{min-height:36px}main{display:flex;justify-content:center;padding:22px}iframe{border:0;background:#f3efe6;max-width:100%;height:780px;box-shadow:0 8px 30px #0002}</style></head><body><header><strong>THARA V3 — معاينة مؤقتة</strong><label>العرض <select id="width"><option>1180</option><option>768</option><option>390</option><option>320</option></select></label><label>الصفحة <select id="page"><option value="index.html">الرئيسية</option><option value="villas.html">الفلل</option><option value="contact.html">خدمات الملاك</option><option value="faq.html">الأسئلة</option><option value="privacy.html">الخصوصية</option><option value="terms.html">الشروط</option></select></label><label><input type="checkbox" id="scripts" checked>JavaScript</label><button id="restart">إعادة</button></header><main><iframe id="preview" title="معاينة موقع ثرى" width="1180" src="index.html" sandbox="allow-scripts allow-same-origin allow-forms"></iframe></main><script>const frame=document.getElementById('preview');const width=document.getElementById('width');const page=document.getElementById('page');const scripts=document.getElementById('scripts');function reload(){frame.setAttribute('sandbox',scripts.checked?'allow-scripts allow-same-origin allow-forms':'allow-same-origin allow-forms');frame.src=page.value}width.addEventListener('change',()=>frame.style.width=width.value+'px');page.addEventListener('change',reload);scripts.addEventListener('change',reload);document.getElementById('restart').addEventListener('click',reload);</script></body></html>
