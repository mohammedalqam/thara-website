<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THARA — فحص الرئيسية</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e4e2da;color:#173b35;font:14px system-ui,sans-serif}header{padding:12px 20px;background:#f3efe6;border-bottom:1px solid #ccc5b8;display:flex;gap:16px;align-items:center;flex-wrap:wrap}h1{font-size:16px;margin:0}label{display:flex;gap:8px;align-items:center}select,button,a{font:inherit;padding:7px 10px;min-height:36px;border:1px solid #aba48f;background:#f3efe6;color:#173b35;border-radius:2px}button{cursor:pointer}nav{display:flex;gap:5px;flex-wrap:wrap}#viewport{position:relative;margin:10px auto;overflow:visible;direction:ltr}iframe{display:block;border:0;background:#f3efe6;transform-origin:top left}output{display:block;font:11px/1.6 monospace;padding:8px 20px;background:#fff;direction:ltr;max-height:90px;overflow:auto}#results{margin:0}small{color:#59665b}main{padding-bottom:24px}
</style></head><body><header><h1>THARA / فحص الرئيسية</h1><label>العرض <select id="size"><option>320</option><option selected>390</option><option>768</option><option>1024</option><option>1440</option><option>1920</option></select></label><label>الاتجاه <select id="orientation"><option value="portrait">عمودي</option><option value="landscape">أفقي</option></select></label><label>الحالة <select id="mode"><option value="normal">عادي</option><option value="reduced">حركة مخففة</option><option value="off">دون WebGL</option><option value="fail">فشل المجسم</option><option value="nojs">دون JavaScript</option></select></label><button id="measure">افحص التخطيط</button><a href="index.html">افتح الرئيسية</a><small>قياسات المتصفح والبديل لا تثبت أداء هاتف حقيقي أو جودة WebGL.</small><nav><button data-section="home">البداية</button><button data-section="tharaStory">THARA</button><button data-section="featured">الفيلا</button><button data-section="ownersSpotlight">الملاك</button><button data-section="gallery">المعرض</button><button data-section="features">المزايا</button><button data-section="contact">الفريق</button><button data-section="homeInquiryTitle">الاستفسار</button><button data-section="end">النهاية</button></nav></header><output id="results">جاهز للفحص</output><main><div id="viewport"><iframe id="page" title="معاينة الرئيسية بالأبعاد المحددة" src="index.html"></iframe></div></main>
<script>
const frame=document.getElementById('page'),size=document.getElementById('size'),orientation=document.getElementById('orientation'),mode=document.getElementById('mode'),out=document.getElementById('results'),wrap=document.getElementById('viewport');
let revision=0;
function dimensions(){const w=Number(size.value);const heights={320:640,390:844,768:1024,1024:768,1440:900,1920:1080};const h=heights[w];return orientation.value==='landscape'&&w<h?{w:h,h:w}:{w,h};}
function fit(){const {w,h}=dimensions();const scale=Math.min(1,(innerWidth-40)/w,(innerHeight-190)/h);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform=`scale(${scale})`;wrap.style.width=w*scale+'px';wrap.style.height=h*scale+'px';}
function report(){const d=frame.contentDocument,w=frame.contentWindow;if(!d?.body)return;const width=d.documentElement.clientWidth,edge=d.body.getBoundingClientRect(),left=edge.left,right=edge.right;const overflow=[...d.querySelectorAll('main *,.site-header *,.site-footer *')].filter(el=>{const r=el.getBoundingClientRect(),s=w.getComputedStyle(el);return r.width&&r.height&&s.display!=='none'&&s.visibility!=='hidden'&&s.position!=='fixed'&&(r.left<left-.6||r.right>right+.6);}).map(el=>({tag:el.tagName,class:el.className,id:el.id,left:+el.getBoundingClientRect().left.toFixed(1),right:+el.getBoundingClientRect().right.toFixed(1)})).slice(0,14);
const result={viewport:[w.innerWidth,w.innerHeight],scrollWidth:d.documentElement.scrollWidth,clientWidth:width,horizontalOverflow:d.documentElement.scrollWidth>width,overflow,contentBounds:[left,right],hidden:d.hidden,motion:d.documentElement.dataset.motion||'full',scene:d.querySelector('[data-villa-chapter]').dataset.sceneState,reason:d.querySelector('[data-villa-chapter]').dataset.sceneReason||'',progress:d.querySelector('[data-villa-chapter]').dataset.progress||null,imageErrors:[...d.images].filter(img=>img.getAttribute('src')&&img.complete&&!img.naturalWidth).map(img=>img.getAttribute('src')),scripts:d.querySelectorAll('script').length,render:d.body.dataset.renderStats?JSON.parse(d.body.dataset.renderStats):null};out.textContent=JSON.stringify(result);out.dataset.result=JSON.stringify(result);}
function reload(){if(mode.value==='nojs')frame.setAttribute('sandbox','allow-same-origin');else frame.removeAttribute('sandbox');const query=mode.value==='off'?'?scene=off':mode.value==='fail'?'?model=fail':'';frame.src='index.html'+query;revision++;fit();}
frame.addEventListener('load',()=>{const w=frame.contentWindow;if(mode.value==='nojs'){report();return;}if(mode.value==='reduced'){w.document.documentElement.dataset.motion='reduced';w.document.dispatchEvent(new w.Event('thara:motionchange'));}else{delete w.document.documentElement.dataset.motion;w.document.dispatchEvent(new w.Event('thara:motionchange'));}report();});
size.addEventListener('change',()=>{fit();setTimeout(report,300);});orientation.addEventListener('change',()=>{fit();setTimeout(report,300);});mode.addEventListener('change',reload);addEventListener('resize',fit);document.getElementById('measure').addEventListener('click',report);
document.querySelectorAll('[data-section]').forEach(button=>button.addEventListener('click',()=>{const d=frame.contentDocument;const el=button.dataset.section==='end'?d.querySelector('[data-letter-end]'):d.getElementById(button.dataset.section);el?.scrollIntoView({block:'start',behavior:'instant'});setTimeout(report,250);}));fit();
</script></body></html>
